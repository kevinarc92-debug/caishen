<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Year of the Sheep: Golden Harvest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

      overflow: hidden;
      background: #8b1111;
      font-family: "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;

    /* 主持人中文导播台 */
    #host-panel {

      right: 16px;
      background: rgba(30, 6, 6, 0.88);

    button, .file-btn {

    }
    button:active, .file-btn:active { transform: scale(0.94); }
    button.secondary, .file-btn.secondary {
      background: rgba(255, 255, 255, 0.16);
      color: #ffe4a0;
      border: 1px solid rgba(255, 215, 0, 0.35);
    }
    button.active-diff {
      background: #ef4444;
      color: #fff;
      border: 1px solid #ffd700;
    }
    .tip-text { font-size: 11px; color: #fcd34d; opacity: 0.92; line-height: 1.35; }
    #diag-box {
      background: rgba(0, 0, 0, 0.52);
      border-radius: 6px;
      padding: 5px 8px;

      font-size: 11px;

</head>
<body>

  <!-- 主持人中文控制面板 (按 H 键可随时隐藏/显示) -->
  <div id="host-panel">
    <div class="host-row">
      <span>🎮 手柄状态:</span>
      <span id="pad-status" class="host-badge disconnected">未连接</span>
    </div>
    <div class="host-row">
      <button onclick="connectWebHID()" style="width:100%; background:linear-gradient(180deg,#4ade80,#16a34a); color:#052e16;">
        🔌 强制直连 Switch 手柄 (Mac蓝牙连上但无反应点此)
      </button>
    </div>
    <div id="diag-box">信号诊断: 等待手柄输入 (也可直接用键盘 ←/→ 测试)</div>
    <div class="host-row">
      <span>🕹️ 握持方式:</span>
      <button class="secondary" onclick="cycleJoyMode()" id="mode-btn">单只左手柄 (L) 横握</button>
    </div>
    <div class="host-row">
      <span>🔥 难度设置:</span>
      <div>
        <button class="secondary" id="diff-easy" onclick="setDifficulty('EASY')">普通</button>
        <button class="active-diff" id="diff-hard" onclick="setDifficulty('HARD')">困难</button>
        <button class="secondary" id="diff-hell" onclick="setDifficulty('HELL')">地狱</button>
      </div>
    </div>
    <div class="host-row">
      <span>🎯 领奖目标分:</span>
      <div>
        <button class="secondary" onclick="adjustTarget(-200)">-200</button>
        <strong id="target-display" style="color:#ffd700; margin:0 6px;">2000</strong>
        <button class="secondary" onclick="adjustTarget(200)">+200</button>
      </div>
    </div>
    <div class="host-row">
      <button onclick="triggerRain()">🌧️ 红包雨</button>
      <button class="secondary" onclick="resetToIdle()">🏠 重置</button>
      <label class="file-btn secondary">
        📂 导入4图
        <input type="file" id="asset-picker" accept="image/*" multiple style="display:none" onchange="handleManualFiles(this.files)" />
      </label>
      <button class="secondary" onclick="toggleHostPanel()" title="按 H 键可重新呼出">👁️ 隐藏</button>
    </div>
    <div id="cors-tip">⚠️ 本地直接双击打开(file://)时，请点「导入4图」全选4张图片以完成自动抠图。</div>
    <div class="tip-text">💡 导播技巧：鼠标点屏幕任意处可空投 +300 巨型元宝；按键盘 <b>H</b> 键可隐藏/显示本面板。</div>
  </div>

  <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  player.y = H - 120;
});

function toggleHostPanel() {
  document.getElementById('host-panel').classList.toggle('hidden');
}

// ================= 美术素材加载与自动贴纸去底 =================
const assets = { bg: null, sheep: null, items: null, chest: null };

function removeStickerBg(img) {
  try {
    const off = document.createElement('canvas');
    off.width = img.width;
    off.height = img.height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);

    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const data = imgData.data;
    const w = off.width, h = off.height;

    const corners = [0, (w - 1) * 4, (h - 1) * w * 4, ((h - 1) * w + (w - 1)) * 4];
    let bgR = 0, bgG = 0, bgB = 0;
    corners.forEach(idx => { bgR += data[idx]; bgG += data[idx + 1]; bgB += data[idx + 2]; });
    bgR /= 4; bgG /= 4; bgB /= 4;

    const visited = new Uint8Array(w * h);
    const queue = new Int32Array(w * h);
    let head = 0, tail = 0;

    function pushIfMatch(x, y) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const pos = y * w + x;
      if (visited[pos]) return;
      const idx = pos * 4;
      const diff = Math.abs(data[idx] - bgR) + Math.abs(data[idx + 1] - bgG) + Math.abs(data[idx + 2] - bgB);
      if (diff < 36) { visited[pos] = 1; queue[tail++] = pos; }
    }

    for (let x = 0; x < w; x++) { pushIfMatch(x, 0); pushIfMatch(x, h - 1); }
    for (let y = 0; y < h; y++) { pushIfMatch(0, y); pushIfMatch(w - 1, y); }

    while (head < tail) {
      const pos = queue[head++];
      data[pos * 4 + 3] = 0;
      const x = pos % w;
      const y = (pos - x) / w;
      pushIfMatch(x + 1, y); pushIfMatch(x - 1, y); pushIfMatch(x, y + 1); pushIfMatch(x, y - 1);
    }

    octx.putImageData(imgData, 0, 0);
    return off;
  } catch (err) {
    document.getElementById('cors-tip').style.display = 'block';
    return img;
  }
}

function loadImage(src, needCutout, key) {
  const img = new Image();
  img.onload = () => { assets[key] = needCutout ? removeStickerBg(img) : img; };
  img.src = src;
}

loadImage('bg.jpg', false, 'bg');
loadImage('sheep.jpg', true, 'sheep');
loadImage('items.jpg', true, 'items');
loadImage('chest.jpg', true, 'chest');

function handleManualFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const name = file.name.toLowerCase();
    let key = null;
    if (name.includes('bg') || name.includes('背景')) key = 'bg';
    else if (name.includes('sheep') || name.includes('羊')) key = 'sheep';
    else if (name.includes('item') || name.includes('道具')) key = 'items';
    else if (name.includes('chest') || name.includes('箱')) key = 'chest';
    if (!key) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        assets[key] = (key !== 'bg') ? removeStickerBg(img) : img;
        document.getElementById('cors-tip').style.display = 'none';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ================= 音效合成器 =================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol = 0.15, slideTo = null) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
  coin: () => { playTone(880, 'sine', 0.12, 0.16, 1320); },
  ingot: () => { playTone(1046, 'triangle', 0.15, 0.22, 1568); setTimeout(() => playTone(1568, 'sine', 0.22, 0.16), 70); },
  bomb: () => { playTone(140, 'sawtooth', 0.42, 0.3, 38); },
  dash: () => { playTone(320, 'sine', 0.1, 0.12, 620); },
  rush: () => { playTone(587.33, 'sawtooth', 0.15, 0.14); setTimeout(() => playTone(880, 'sawtooth', 0.25, 0.16), 120); },
  unlock: () => {
    [523.25, 659.25, 783.99, 1046.50, 1318.5].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.3, 0.22), i * 80));
  },
  win: () => {
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25, 0.22), i * 110));
  }
};

// ================= 游戏核心状态与难度配置 =================
const GAME_DURATION = 30;
let state = 'IDLE';
let score = 0;
let targetScore = 2000;
let targetReached = false;
let timeLeft = GAME_DURATION;
let combo = 0;
let maxCombo = 0;
let rainTimer = 0;
let endCooldown = 0;
let shakeTimer = 0;
let shakeIntensity = 0;
let chestPopTimer = 0;
let sootFlashAlpha = 0;
let rushAnnounced = false;

const DIFFICULTIES = {
  EASY: { target: 1400, speedMult: 1.0,  spawnBase: 0.50, bombRate: 0.22, bombPenalty: -100, swayAmp: 35 },
  HARD: { target: 2000, speedMult: 1.38, spawnBase: 0.38, bombRate: 0.33, bombPenalty: -150, swayAmp: 95 },
  HELL: { target: 2600, speedMult: 1.68, spawnBase: 0.30, bombRate: 0.41, bombPenalty: -200, swayAmp: 145 }
};
let currentDiff = 'HARD';

function setDifficulty(level) {
  currentDiff = level;
  const cfg = DIFFICULTIES[level];
  targetScore = cfg.target;
  document.getElementById('target-display').textContent = targetScore;
  ['EASY', 'HARD', 'HELL'].forEach(k => {
    const btn = document.getElementById('diff-' + k.toLowerCase());
    btn.className = (k === level) ? 'active-diff' : 'secondary';
  });
}

// 0: 标准双手柄/Pro | 1: 单只左手柄 (L) 横握 | 2: 单只右手柄 (R) 横握
let joyMode = 1;
const JOY_MODES = ['标准双手柄 / Pro', '单只左手柄 (L) 横握', '单只右手柄 (R) 横握'];

function cycleJoyMode() {
  joyMode = (joyMode + 1) % JOY_MODES.length;
  document.getElementById('mode-btn').textContent = JOY_MODES[joyMode];
}

const player = {
  x: W / 2, y: H - 120, w: 144, h: 144,
  speed: 860, vx: 0, stunTimer: 0, dashCooldown: 0, dashTimer: 0, facing: 1, bounceScale: 1
};

let items = [], particles = [], floatingTexts = [], spawnTimer = 0;

function triggerShake(duration, intensity) {
  shakeTimer = Math.max(shakeTimer, duration);
  shakeIntensity = Math.max(shakeIntensity, intensity);
}

function adjustTarget(delta) {
  initAudio();
  targetScore = Math.max(200, targetScore + delta);
  document.getElementById('target-display').textContent = targetScore;
  if (state === 'PLAYING' && !targetReached && score >= targetScore) unlockChest();
}

function unlockChest() {
  targetReached = true;
  chestPopTimer = 1.2;
  sfx.unlock();
  triggerShake(0.45, 14);
  spawnPaperConfetti(W / 2 + Math.min(270, W * 0.24), 60, 60);
  spawnFloatingText(W / 2, H * 0.34, '🏆 GOLDEN CHEST UNLOCKED · PRIZE WON!', '#fde047', 40);
}

function triggerRain() {
  initAudio();
  if (state !== 'PLAYING') startGame();
  rainTimer = 5.0;
  sfx.unlock();
  triggerShake(0.3, 10);
  spawnFloatingText(W / 2, H * 0.3, '🌧️ LUCKY RED ENVELOPE RAIN!', '#ffd700', 38);
}

function resetToIdle() {
  state = 'IDLE'; items = []; particles = []; floatingTexts = []; sootFlashAlpha = 0;
}

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (state === 'IDLE') { startGame(); return; }
  if (state === 'RESULT' && endCooldown <= 0) { startGame(); return; }
  if (state === 'PLAYING') {
    items.push({
      x: e.clientX, baseX: e.clientX, y: Math.max(80, e.clientY - 40),
      vy: 280, type: 'MEGA_INGOT', score: 300, radius: 48,
      rot: 0, rotSpeed: 1.5, phase: 0, swayAmp: 0, swayFreq: 0
    });
    sfx.ingot();
    spawnPaperConfetti(e.clientX, e.clientY, 18);
  }
});

// ================= 双引擎 Switch 手柄驱动 (WebHID 底层直连 + Gamepad API) =================
let hidDevice = null;
let hidMoveX = 0;
let hidAnyBtn = false;
let hidDebugStr = '';

async function connectWebHID() {
  if (!('hid' in navigator)) {
    alert('当前浏览器不支持 WebHID 直连，请使用最新版 Google Chrome 浏览器。');
    return;
  }
  try {
    const devices = await navigator.hid.requestDevice({
      filters: [{ vendorId: 0x057e }] // Nintendo Switch 官方硬件 ID
    });
    if (!devices || devices.length === 0) return;
    const device = devices[0];
    if (!device.opened) await device.open();
    hidDevice = device;

    const name = (device.productName || '').toLowerCase();
    if (name.includes('(l)')) { joyMode = 1; document.getElementById('mode-btn').textContent = JOY_MODES[1]; }
    else if (name.includes('(r)')) { joyMode = 2; document.getElementById('mode-btn').textContent = JOY_MODES[2]; }

    device.addEventListener('inputreport', handleHIDReport);
    hidDebugStr = `WebHID已接管: ${device.productName || 'Switch手柄'}`;
  } catch (err) {
    console.warn('WebHID 连接取消或失败:', err);
  }
}

if ('hid' in navigator) {
  navigator.hid.getDevices().then(async (devices) => {
    const nintendo = devices.find(d => d.vendorId === 0x057e);
    if (nintendo) {
      if (!nintendo.opened) await nintendo.open();
      hidDevice = nintendo;
      const name = (nintendo.productName || '').toLowerCase();
      if (name.includes('(l)')) { joyMode = 1; document.getElementById('mode-btn').textContent = JOY_MODES[1]; }
      else if (name.includes('(r)')) { joyMode = 2; document.getElementById('mode-btn').textContent = JOY_MODES[2]; }
      nintendo.addEventListener('inputreport', handleHIDReport);
      hidDebugStr = `WebHID自动重连: ${nintendo.productName || 'Switch手柄'}`;
    }
  }).catch(() => {});
}

function handleHIDReport(event) {
  const { data, reportId } = event;
  if (reportId === 0x3F && data.byteLength >= 3) {
    const b0 = data.getUint8(0);
    const b1 = data.getUint8(1);
    const hat = data.getUint8(2);

    hidAnyBtn = (b0 !== 0) || ((b1 & 0xDF) !== 0);

    let sx = 0;
    if (hat < 8) {
      const isUp = (hat === 7 || hat === 0 || hat === 1);
      const isDown = (hat === 3 || hat === 4 || hat === 5);
      const isLeft = (hat === 5 || hat === 6 || hat === 7);
      const isRight = (hat === 1 || hat === 2 || hat === 3);

      if (joyMode === 0) { if (isLeft) sx = -1; else if (isRight) sx = 1; }
      else if (joyMode === 1) { if (isUp) sx = -1; else if (isDown) sx = 1; }
      else if (joyMode === 2) { if (isDown) sx = -1; else if (isUp) sx = 1; }
    }
    hidMoveX = sx;
    hidDebugStr = `WebHID[0x3F] btn:${b0.toString(16)}/${b1.toString(16)} hat:${hat} -> 移动:${sx}`;
  } else if ((reportId === 0x30 || reportId === 0x21) && data.byteLength >= 11) {
    const b2 = data.getUint8(2);
    const b3 = data.getUint8(3);
    const b4 = data.getUint8(4);
    hidAnyBtn = (b2 !== 0) || ((b3 & 0x3F) !== 0) || (b4 !== 0);

    const lx = data.getUint8(5) | ((data.getUint8(6) & 0x0F) << 8);
    const ly = (data.getUint8(6) >> 4) | (data.getUint8(7) << 4);
    const rx = data.getUint8(8) | ((data.getUint8(9) & 0x0F) << 8);
    const ry = (data.getUint8(9) >> 4) | (data.getUint8(10) << 4);

    const useLeft = Math.abs(lx - 2048) + Math.abs(ly - 2048) > Math.abs(rx - 2048) + Math.abs(ry - 2048);
    const rawX = ((useLeft ? lx : rx) - 2048) / 1150;
    const rawY = ((useLeft ? ly : ry) - 2048) / 1150;

    let sx = 0;
    if (joyMode === 0) sx = Math.abs(rawX) > 0.2 ? rawX : 0;
    else if (joyMode === 1) sx = Math.abs(rawY) > 0.2 ? -rawY : 0;
    else if (joyMode === 2) sx = Math.abs(rawY) > 0.2 ? rawY : 0;

    hidMoveX = Math.max(-1, Math.min(1, sx));
    hidDebugStr = `WebHID[0x30] rawX:${rawX.toFixed(1)} rawY:${rawY.toFixed(1)} -> 移动:${hidMoveX.toFixed(1)}`;
  }
}

const keys = {};
window.addEventListener('keydown', (e) => {
  initAudio();
  if (e.code === 'KeyH') { toggleHostPanel(); return; }
  keys[e.code] = true;
  if ((state === 'IDLE' || (state === 'RESULT' && endCooldown <= 0)) && (e.code === 'Space' || e.code === 'Enter')) startGame();
  if (state === 'PLAYING' && e.code === 'Space') triggerDash();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

window.addEventListener('gamepadconnected', (e) => {
  const id = e.gamepad.id.toLowerCase();
  if (id.includes('(l)')) { joyMode = 1; document.getElementById('mode-btn').textContent = JOY_MODES[1]; }
  else if (id.includes('(r)')) { joyMode = 2; document.getElementById('mode-btn').textContent = JOY_MODES[2]; }
});

let prevAnyButton = false;

function readInput() {
  let moveX = 0;
  let anyBtn = false;

  if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

  const badge = document.getElementById('pad-status');
  const diag = document.getElementById('diag-box');

  if (hidDevice && hidDevice.opened) {
    badge.textContent = `已直连 (${(hidDevice.productName || 'Joy-Con').slice(0, 14)})`;
    badge.className = 'host-badge connected';
    if (hidMoveX !== 0) moveX = hidMoveX;
    if (hidAnyBtn) anyBtn = true;
    diag.textContent = hidDebugStr || 'WebHID 已就绪，请推摇杆或按键';
  } else {
    const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(p => p && p.connected) : [];
    if (pads.length > 0) {
      let activePad = pads[0];
      for (const p of pads) { if (p.buttons.some(b => b.pressed)) { activePad = p; break; } }

      badge.textContent = `已连接 (${pads.length}个)`;
      badge.className = 'host-badge connected';

      const pressedIdx = [];
      activePad.buttons.forEach((b, idx) => { if (b.pressed) pressedIdx.push(idx); });
      if (pressedIdx.length > 0) anyBtn = true;

      const a0 = activePad.axes[0] ?? 0;
      const a1 = activePad.axes[1] ?? 0;
      const a9 = activePad.axes[9];

      let stickX = 0;
      if (joyMode === 0) {
        stickX = Math.abs(a0) > 0.18 ? a0 : (Math.abs(activePad.axes[2] || 0) > 0.18 ? activePad.axes[2] : 0);
        if (activePad.buttons[14]?.pressed) stickX = -1;
        if (activePad.buttons[15]?.pressed) stickX = 1;
      } else if (joyMode === 1) {
        if (Math.abs(a1) > 0.18) stickX = a1;
        else if (Math.abs(a0) > 0.18) stickX = -a0;
      } else if (joyMode === 2) {
        if (Math.abs(a1) > 0.18) stickX = -a1;
        else if (Math.abs(a0) > 0.18) stickX = a0;
      }

      if (stickX === 0 && typeof a9 === 'number' && a9 >= -1.05 && a9 <= 1.05) {
        const isUp = (a9 <= -0.65 || a9 >= 0.95);
        const isDown = (a9 >= -0.2 && a9 <= 0.5);
        const isLeft = (a9 >= 0.35 && a9 <= 1.05);
        const isRight = (a9 >= -0.75 && a9 <= -0.05);
        if (joyMode === 0) { if (isLeft) stickX = -1; else if (isRight) stickX = 1; }
        else if (joyMode === 1) { if (isUp) stickX = -1; else if (isDown) stickX = 1; }
        else if (joyMode === 2) { if (isDown) stickX = -1; else if (isUp) stickX = 1; }
      }

      if (stickX !== 0) moveX = stickX;
      diag.textContent = `Gamepad:${activePad.id.slice(0, 14)} | 键:[${pressedIdx.join(',')}] | a0:${a0.toFixed(1)} a1:${a1.toFixed(1)}`;
    } else {
      badge.textContent = '未检测到手柄';
      badge.className = 'host-badge disconnected';
      diag.textContent = '提示: 若Mac蓝牙已连但此处显示未检测，请点上方绿色「强制直连 Switch 手柄」按钮';
    }
  }

  if (anyBtn && !prevAnyButton) {
    initAudio();
    if (state === 'IDLE') startGame();
    else if (state === 'RESULT' && endCooldown <= 0) startGame();
    else if (state === 'PLAYING') triggerDash();
  }
  prevAnyButton = anyBtn;

  return Math.max(-1, Math.min(1, moveX));
}

function triggerDash() {
  if (player.dashCooldown <= 0 && player.stunTimer <= 0) {
    player.dashTimer = 0.16;
    player.dashCooldown = 0.6;
    player.bounceScale = 1.25;
    sfx.dash();
    spawnPaperConfetti(player.x, player.y + 30, 12);
  }
}

function startGame() {
  state = 'PLAYING';
  score = 0; targetReached = false; timeLeft = GAME_DURATION;
  combo = 0; maxCombo = 0; rainTimer = 0; sootFlashAlpha = 0; rushAnnounced = false;
  items = []; particles = []; floatingTexts = [];
  player.x = W / 2; player.stunTimer = 0; player.dashTimer = 0; player.bounceScale = 1;
  sfx.coin();
}

function finishGame() {
  state = 'RESULT';
  endCooldown = 1.5;
  sootFlashAlpha = 0;
  if (score >= targetScore) {
    sfx.win();
    triggerShake(0.5, 12);
    for (let i = 0; i < 6; i++) {
      setTimeout(() => spawnPaperConfetti(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.4), 35), i * 240);
    }
  } else {
    sfx.bomb();
  }
}

// ================= 掉落物与高难度轨迹 =================
function spawnItem() {
  const cfg = DIFFICULTIES[currentDiff];
  const margin = 110;
  const baseX = margin + Math.random() * (W - margin * 2);
  const progress = 1 - timeLeft / GAME_DURATION;
  const isRush = timeLeft <= 10;
  const speedScale = cfg.speedMult * (1 + progress * 0.32) * (isRush ? 1.22 : 1.0);
  const rotSpeed = (Math.random() - 0.5) * 4.2;

  if (rainTimer > 0) {
    const isIngot = Math.random() < 0.35;
    items.push({
      x: baseX, baseX, y: -50, vy: (380 + Math.random() * 140) * cfg.speedMult,
      type: isIngot ? 'INGOT' : 'RED_PACKET', score: isIngot ? 150 : 50,
      radius: isIngot ? 36 : 32, rot: 0, rotSpeed, phase: 0, swayAmp: 0, swayFreq: 0
    });
    return;
  }

  const r = Math.random();
  const bombProb = cfg.bombRate + (isRush ? 0.08 : 0);
  const phase = Math.random() * Math.PI * 2;
  const swayFreq = 2.2 + Math.random() * 2.0;

  if (r < bombProb) {
    items.push({
      x: baseX, baseX, y: -50, vy: (310 + Math.random() * 110) * speedScale,
      type: 'BOMB', score: cfg.bombPenalty, radius: 34, rot: 0, rotSpeed,
      phase, swayAmp: cfg.swayAmp * 0.85, swayFreq
    });
  } else if (r < bombProb + 0.18) {
    items.push({
      x: baseX, baseX, y: -50, vy: (370 + Math.random() * 110) * speedScale,
      type: 'INGOT', score: 150, radius: 36, rot: 0, rotSpeed,
      phase, swayAmp: cfg.swayAmp * 1.15, swayFreq: swayFreq * 1.1
    });
  } else if (r < bombProb + 0.44) {
    items.push({
      x: baseX, baseX, y: -50, vy: (300 + Math.random() * 90) * speedScale,
      type: 'DUMPLING', score: 80, radius: 32, rot: 0, rotSpeed,
      phase, swayAmp: cfg.swayAmp * 0.5, swayFreq
    });
  } else {
    items.push({
      x: baseX, baseX, y: -50, vy: (270 + Math.random() * 85) * speedScale,
      type: 'RED_PACKET', score: 50, radius: 32, rot: 0, rotSpeed,
      phase, swayAmp: cfg.swayAmp * 0.35, swayFreq
    });
  }
}

function spawnPaperConfetti(x, y, count, isSmoke = false) {
  const palette = isSmoke ? ['#111827', '#374151', '#6b7280', '#ef4444'] : ['#ffd700', '#ef4444', '#ffffff', '#fbbf24', '#f87171'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = isSmoke ? (110 + Math.random() * 250) : (140 + Math.random() * 380);
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - (isSmoke ? 40 : 140),
      life: 0.65 + Math.random() * 0.45, maxLife: 1.1,
      color: palette[Math.floor(Math.random() * palette.length)],
      size: isSmoke ? (12 + Math.random() * 16) : (6 + Math.random() * 7),
      shape: isSmoke ? 'circle' : (Math.random() < 0.45 ? 'star' : 'ribbon'),
      rot: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 14
    });
  }
}

function spawnFloatingText(x, y, text, color, size = 28) {
  floatingTexts.push({ x, y, text, color, size, life: 1.1, scale: 1.38 });
}

function update(dt) {
  const moveX = readInput();

  if (shakeTimer > 0) shakeTimer -= dt;
  if (chestPopTimer > 0) chestPopTimer -= dt;
  if (sootFlashAlpha > 0) sootFlashAlpha = Math.max(0, sootFlashAlpha - dt * 1.3);
  player.bounceScale += (1 - player.bounceScale) * Math.min(1, dt * 14);

  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.shape === 'circle' ? 120 : 480) * dt; p.rot += p.vRot * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);

  floatingTexts.forEach(f => { f.y -= 65 * dt; f.scale += (1 - f.scale) * Math.min(1, dt * 12); f.life -= dt; });
  floatingTexts = floatingTexts.filter(f => f.life > 0);

  if (state === 'RESULT') { if (endCooldown > 0) endCooldown -= dt; return; }
  if (state !== 'PLAYING') return;

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finishGame(); return; }

  if (timeLeft <= 10 && !rushAnnounced) {
    rushAnnounced = true;
    sfx.rush();
    triggerShake(0.35, 10);
    spawnFloatingText(W / 2, H * 0.28, '⚡ FINAL 10s RUSH! SPEED UP! ⚡', '#fde047', 38);
  }

  if (rainTimer > 0) rainTimer -= dt;
  if (player.stunTimer > 0) player.stunTimer -= dt;
  if (player.dashCooldown > 0) player.dashCooldown -= dt;
  if (player.dashTimer > 0) player.dashTimer -= dt;

  if (player.stunTimer <= 0) {
    const mult = player.dashTimer > 0 ? 2.45 : 1.0;
    player.vx = moveX * player.speed * mult;
    if (Math.abs(moveX) > 0.1) player.facing = moveX > 0 ? 1 : -1;
    player.x += player.vx * dt;
    player.x = Math.max(75, Math.min(W - 75, player.x));
  }

  const cfg = DIFFICULTIES[currentDiff];
  const isRush = timeLeft <= 10;
  spawnTimer -= dt;
  const interval = rainTimer > 0 ? 0.14 : Math.max(0.18, cfg.spawnBase * (isRush ? 0.72 : 1.0));
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = interval; }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.rot += it.rotSpeed * dt;
    if (it.swayAmp > 0) {
      it.phase += it.swayFreq * dt;
      it.x = Math.max(60, Math.min(W - 60, it.baseX + Math.sin(it.phase) * it.swayAmp));
    }

    if (Math.abs(it.x - player.x) < player.w * 0.44 + it.radius * 0.68 && Math.abs(it.y - player.y) < player.h * 0.42 + it.radius * 0.68) {
      if (it.type === 'BOMB') {
        score = Math.max(0, score + it.score);
        combo = 0; player.stunTimer = 1.05; player.bounceScale = 0.72;
        sootFlashAlpha = 0.45;
        sfx.bomb(); triggerShake(0.45, 22);
        spawnPaperConfetti(it.x, it.y, 32, true);
        spawnFloatingText(player.x, player.y - 75, `💥 STUNNED! ${it.score}`, '#ef4444', 34);
      } else {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        const bonusMult = combo >= 12 ? 2.0 : (combo >= 5 ? 1.5 : 1.0);
        const gained = Math.round(it.score * bonusMult);
        score += gained;
        player.bounceScale = it.type === 'MEGA_INGOT' ? 1.32 : 1.18;

        if (it.type === 'INGOT' || it.type === 'MEGA_INGOT') {
          sfx.ingot();
          triggerShake(0.18, it.type === 'MEGA_INGOT' ? 12 : 6);
          spawnPaperConfetti(it.x, it.y, it.type === 'MEGA_INGOT' ? 40 : 22);
        } else {
          sfx.coin();
          spawnPaperConfetti(it.x, it.y, 12);
        }

        const comboTag = bonusMult > 1 ? ` 🔥${combo}x COMBO!` : '';
        spawnFloatingText(player.x, player.y - 70, `+${gained}${comboTag}`, '#fde047', it.type === 'MEGA_INGOT' ? 38 : 28);
        if (!targetReached && score >= targetScore) unlockChest();
      }
      items.splice(i, 1);
      continue;
    }
    if (it.y > H + 70) items.splice(i, 1);
  }
}

// ================= 渲染绘制 =================
function drawBackground() {
  if (assets.bg) {
    const imgRatio = assets.bg.width / assets.bg.height;
    const winRatio = W / H;
    let drawW, drawH, offsetX, offsetY;
    if (winRatio > imgRatio) { drawW = W; drawH = W / imgRatio; offsetX = 0; offsetY = H - drawH; }
    else { drawH = H; drawW = H * imgRatio; offsetX = (W - drawW) / 2; offsetY = 0; }
    ctx.drawImage(assets.bg, offsetX, offsetY, drawW, drawH);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fef3c7'); grad.addColorStop(1, '#dc2626');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  const isMoving = Math.abs(player.vx) > 20 && player.stunTimer <= 0;
  const hopY = isMoving ? -Math.abs(Math.sin(Date.now() / 75)) * 12 : 0;
  const tilt = isMoving ? Math.sin(Date.now() / 75) * 0.08 : 0;

  if (player.stunTimer > 0) {
    ctx.translate(Math.sin(Date.now() / 22) * 11, 0);
    ctx.rotate(Math.sin(Date.now() / 40) * 0.28);
  } else {
    ctx.translate(0, hopY);
    ctx.rotate(tilt);
  }

  ctx.fillStyle = 'rgba(80, 10, 10, 0.28)';
  ctx.beginPath(); ctx.ellipse(0, 62 - hopY, 56 * player.bounceScale, 14, 0, 0, Math.PI * 2); ctx.fill();

  ctx.scale(-player.facing * player.bounceScale, player.bounceScale);
  if (assets.sheep) ctx.drawImage(assets.sheep, -player.w / 2, -player.h / 2, player.w, player.h);
  else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);

  if (assets.items) {
    const hw = assets.items.width / 2, hh = assets.items.height / 2;
    let sx = 0, sy = 0;
    if (it.type === 'RED_PACKET') { sx = hw; sy = 0; }
    else if (it.type === 'DUMPLING') { sx = 0; sy = hh; }
    else if (it.type === 'BOMB') { sx = hw; sy = hh; }

    const size = it.radius * 2.45;
    if (it.type === 'MEGA_INGOT') { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 24; }
    ctx.drawImage(assets.items, sx, sy, hw, hh, -size / 2, -size / 2, size, size);
  } else {
    ctx.fillStyle = it.type === 'BOMB' ? '#1f2937' : '#fbbf24';
    ctx.beginPath(); ctx.arc(0, 0, it.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); }
    else if (p.shape === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * p.size * 1.4, -Math.sin((18 + i * 72) * Math.PI / 180) * p.size * 1.4);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * p.size * 0.6, -Math.sin((54 + i * 72) * Math.PI / 180) * p.size * 0.6);
      }
      ctx.closePath(); ctx.fill();
    } else { ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); }
    ctx.restore();
  });
}

function drawHUD() {
  const barW = Math.min(540, W * 0.46), barH = 38, barX = (W - barW) / 2 - 24, barY = 26;
  ctx.fillStyle = 'rgba(65, 10, 10, 0.76)';
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 19); ctx.fill();

  const ratio = Math.min(1, score / targetScore);
  if (ratio > 0) {
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, targetReached ? '#16a34a' : '#f59e0b');
    grad.addColorStop(1, '#fde047');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(barX + 3, barY + 3, (barW - 6) * ratio, barH - 6, 16); ctx.fill();
  }

  ctx.strokeStyle = targetReached ? '#4ade80' : '#ffd700';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 19); ctx.stroke();

  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
  ctx.fillText(
    targetReached ? `🎉 CHEST UNLOCKED! ${score} pts (Prize Secured!)` : `🎯 Prize Goal: ${score} / ${targetScore} pts`,
    barX + barW / 2, barY + 25
  );
  ctx.shadowBlur = 0;

  const chestX = barX + barW + 40, chestY = barY + barH / 2 - 4;
  ctx.save();
  ctx.translate(chestX, chestY);
  if (!targetReached && ratio > 0.7) ctx.rotate(Math.sin(Date.now() / 45) * 0.14);
  const popScale = targetReached ? (1.28 + Math.max(0, chestPopTimer) * 0.35) : 1.0;
  ctx.scale(popScale, popScale);

  if (assets.chest) {
    const hw = assets.chest.width / 2, hh = assets.chest.height;
    const drawW = 88, drawH = drawW * (hh / hw);
    ctx.drawImage(assets.chest, targetReached ? hw : 0, 0, hw, hh, -drawW / 2, -drawH / 2, drawW, drawH);
  }
  ctx.restore();

  if (state === 'PLAYING') {
    const isRush = timeLeft <= 10;
    ctx.fillStyle = isRush ? '#dc2626' : '#7f1d1d';
    ctx.beginPath(); ctx.roundRect(W / 2 - 74, barY + 48, 148, 42, 21); ctx.fill();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = isRush ? '#ffffff' : '#fde047';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(`⏱ ${Math.ceil(timeLeft)}s`, W / 2, barY + 79);
  }
}

function drawOverlay() {
  if (state === 'IDLE') {
    ctx.fillStyle = 'rgba(45, 5, 5, 0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd700'; ctx.font = 'bold 50px sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 10;
    ctx.fillText('🐑 YEAR OF THE SHEEP: GOLDEN HARVEST 🧧', W / 2, H * 0.35);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 25px sans-serif';
    ctx.fillText(`Score ${targetScore} pts in 30s to unlock the Golden Chest & win a prize!`, W / 2, H * 0.44);

    ctx.fillStyle = '#fde047'; ctx.font = '20px sans-serif';
    ctx.fillText('🕹️ Stick Left/Right to Move · Dodge Black Bombs · Any Button to Dash', W / 2, H * 0.51);
    ctx.shadowBlur = 0;

    const pulse = 1 + Math.sin(Date.now() / 220) * 0.05;
    ctx.save(); ctx.translate(W / 2, H * 0.63); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.roundRect(-235, -28, 470, 56, 28); ctx.fill();
    ctx.fillStyle = '#7f1d1d'; ctx.font = 'bold 23px sans-serif';
    ctx.fillText('Press Any Controller Button to Start!', 0, 8);
    ctx.restore();
  }

  if (state === 'RESULT') {
    ctx.fillStyle = 'rgba(35, 5, 5, 0.76)'; ctx.fillRect(0, 0, W, H);
    const win = score >= targetScore;
    ctx.textAlign = 'center'; ctx.fillStyle = win ? '#4ade80' : '#fca5a5'; ctx.font = 'bold 50px sans-serif';
    ctx.fillText(win ? '🏆 GOLDEN CHEST UNLOCKED · YOU WIN A PRIZE!' : '🧧 SO CLOSE · TRY AGAIN!', W / 2, H * 0.34);

    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 38px sans-serif';
    ctx.fillText(`Final Score: ${score} pts  (Target: ${targetScore} pts)`, W / 2, H * 0.45);

    ctx.fillStyle = '#fde047'; ctx.font = '22px sans-serif';
    ctx.fillText(`Max Combo: ${maxCombo}x`, W / 2, H * 0.52);

    if (endCooldown <= 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
      ctx.fillText('👉 Next Player: Press Any Controller Button to Play Again', W / 2, H * 0.64);
    }
  }
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);

  ctx.save();
  if (shakeTimer > 0) {
    const mag = shakeIntensity * (shakeTimer / 0.45);
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();
  drawParticles();

  if (sootFlashAlpha > 0) {
    ctx.fillStyle = `rgba(15, 15, 20, ${sootFlashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  floatingTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.translate(f.x, f.y); ctx.scale(f.scale, f.scale);
    ctx.fillStyle = f.color; ctx.font = `bold ${f.size}px sans-serif`; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 5;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  });

  drawHUD();
  drawOverlay();
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
