<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>羊年接元宝 · 纸艺冲关赢好礼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      overflow: hidden;
      background: #8b1111;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* 主持人鼠标导播台 */
    #host-panel {
      position: fixed;
      top: 14px;
      right: 16px;
      background: rgba(35, 8, 8, 0.82);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      z-index: 100;
      max-width: 310px;
    }
    .host-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .host-badge {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: bold;
    }
    .connected { background: #16a34a; color: #fff; }
    .disconnected { background: #991b1b; color: #fca5a5; }
    button, .file-btn {
      background: linear-gradient(180deg, #ffd700, #e6a800);
      color: #5c0000;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: transform 0.1s;
      display: inline-block;
    }
    button:active, .file-btn:active { transform: scale(0.94); }
    button.secondary, .file-btn.secondary {
      background: rgba(255, 255, 255, 0.16);
      color: #ffe4a0;
      border: 1px solid rgba(255, 215, 0, 0.35);
    }
    .tip-text { font-size: 11px; color: #fcd34d; opacity: 0.9; line-height: 1.4; }
    #diag-box {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 6px;
      padding: 5px 8px;
      font-family: monospace;
      font-size: 11px;
      color: #a7f3d0;
      line-height: 1.35;
      word-break: break-all;
    }
    #cors-tip { font-size: 11px; color: #fca5a5; display: none; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- 主持人鼠标控制面板 -->
  <div id="host-panel">
    <div class="host-row">
      <span>🎮 手柄:</span>
      <span id="pad-status" class="host-badge disconnected">未连接 (按任意键唤醒)</span>
    </div>
    <div id="diag-box">诊断: 等待手柄按键信号...</div>
    <div class="host-row">
      <span>🕹️ 握持模式:</span>
      <button class="secondary" onclick="cycleJoyMode()" id="mode-btn">标准双手柄 / Pro</button>
    </div>
    <div class="host-row">
      <span>🎯 领奖分:</span>
      <div>
        <button class="secondary" onclick="adjustTarget(-200)">-200</button>
        <strong id="target-display" style="color:#ffd700; margin:0 6px;">1200</strong>
        <button class="secondary" onclick="adjustTarget(200)">+200</button>
      </div>
    </div>
    <div class="host-row">
      <button onclick="triggerRain()">🌧️ 红包雨</button>
      <button class="secondary" onclick="resetToIdle()">🏠 重置</button>
      <label class="file-btn secondary">
        📂 导入4图
        <input type="file" id="asset-picker" accept="image/*" multiple style="display:none" onchange="handleManualFiles(this.files)" />
      </label>
    </div>
    <div id="cors-tip">⚠️ 检测到双击本地文件(file://)，若贴图有白框请点「导入4图」全选4张图；若手柄无法识别请用 localhost 打开。</div>
    <div class="tip-text">💡 鼠标点击屏幕任意处可空投 +300 巨型元宝（键盘 ←/→ 也可保底控制）</div>
  </div>

  <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  player.y = H - 115;
});

// ================= 美术素材加载与自动贴纸去底 =================
const assets = { bg: null, sheep: null, items: null, chest: null };

function removeStickerBg(img) {
  try {
    const off = document.createElement('canvas');
    off.width = img.width;
    off.height = img.height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);

    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const data = imgData.data;
    const w = off.width, h = off.height;

    const corners = [0, (w - 1) * 4, (h - 1) * w * 4, ((h - 1) * w + (w - 1)) * 4];
    let bgR = 0, bgG = 0, bgB = 0;
    corners.forEach(idx => { bgR += data[idx]; bgG += data[idx + 1]; bgB += data[idx + 2]; });
    bgR /= 4; bgG /= 4; bgB /= 4;

    const visited = new Uint8Array(w * h);
    const queue = new Int32Array(w * h);
    let head = 0, tail = 0;

    function pushIfMatch(x, y) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const pos = y * w + x;
      if (visited[pos]) return;
      const idx = pos * 4;
      const diff = Math.abs(data[idx] - bgR) + Math.abs(data[idx + 1] - bgG) + Math.abs(data[idx + 2] - bgB);
      if (diff < 36) { visited[pos] = 1; queue[tail++] = pos; }
    }

    for (let x = 0; x < w; x++) { pushIfMatch(x, 0); pushIfMatch(x, h - 1); }
    for (let y = 0; y < h; y++) { pushIfMatch(0, y); pushIfMatch(w - 1, y); }

    while (head < tail) {
      const pos = queue[head++];
      data[pos * 4 + 3] = 0;
      const x = pos % w;
      const y = (pos - x) / w;
      pushIfMatch(x + 1, y); pushIfMatch(x - 1, y); pushIfMatch(x, y + 1); pushIfMatch(x, y - 1);
    }

    octx.putImageData(imgData, 0, 0);
    return off;
  } catch (err) {
    document.getElementById('cors-tip').style.display = 'block';
    return img;
  }
}

function loadImage(src, needCutout, key) {
  const img = new Image();
  img.onload = () => { assets[key] = needCutout ? removeStickerBg(img) : img; };
  img.src = src;
}

loadImage('bg.jpg', false, 'bg');
loadImage('sheep.jpg', true, 'sheep');
loadImage('items.jpg', true, 'items');
loadImage('chest.jpg', true, 'chest');

function handleManualFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const name = file.name.toLowerCase();
    let key = null;
    if (name.includes('bg') || name.includes('背景')) key = 'bg';
    else if (name.includes('sheep') || name.includes('羊')) key = 'sheep';
    else if (name.includes('item') || name.includes('道具')) key = 'items';
    else if (name.includes('chest') || name.includes('箱')) key = 'chest';
    if (!key) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        assets[key] = (key !== 'bg') ? removeStickerBg(img) : img;
        document.getElementById('cors-tip').style.display = 'none';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ================= 音效合成器 =================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, vol = 0.15, slideTo = null) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
  coin: () => { playTone(880, 'sine', 0.12, 0.16, 1320); },
  ingot: () => { playTone(1046, 'triangle', 0.15, 0.22, 1568); setTimeout(() => playTone(1568, 'sine', 0.22, 0.16), 70); },
  bomb: () => { playTone(140, 'sawtooth', 0.38, 0.28, 42); },
  dash: () => { playTone(320, 'sine', 0.1, 0.12, 620); },
  unlock: () => {
    [523.25, 659.25, 783.99, 1046.50, 1318.5].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.3, 0.22), i * 80));
  },
  win: () => {
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25, 0.22), i * 110));
  }
};

// ================= 游戏状态 =================
const GAME_DURATION = 30;
let state = 'IDLE';
let score = 0;
let targetScore = 1200;
let targetReached = false;
let timeLeft = GAME_DURATION;
let combo = 0;
let maxCombo = 0;
let rainTimer = 0;
let endCooldown = 0;
let shakeTimer = 0;
let shakeIntensity = 0;
let chestPopTimer = 0;

// 0: 标准双手柄/Pro | 1: 单只左手柄 Joy-Con(L)横握 | 2: 单只右手柄 Joy-Con(R)横握
let joyMode = 0;
const JOY_MODES = ['标准双手柄 / Pro', '单只左手柄 (L) 横握', '单只右手柄 (R) 横握'];

function cycleJoyMode() {
  joyMode = (joyMode + 1) % JOY_MODES.length;
  document.getElementById('mode-btn').textContent = JOY_MODES[joyMode];
}

const player = {
  x: W / 2, y: H - 115, w: 130, h: 130,
  speed: 820, vx: 0, stunTimer: 0, dashCooldown: 0, dashTimer: 0, facing: 1, bounceScale: 1
};

let items = [], particles = [], floatingTexts = [], spawnTimer = 0;

function triggerShake(duration, intensity) {
  shakeTimer = Math.max(shakeTimer, duration);
  shakeIntensity = Math.max(shakeIntensity, intensity);
}

function adjustTarget(delta) {
  initAudio();
  targetScore = Math.max(200, targetScore + delta);
  document.getElementById('target-display').textContent = targetScore;
  if (state === 'PLAYING' && !targetReached && score >= targetScore) unlockChest();
}

function unlockChest() {
  targetReached = true;
  chestPopTimer = 1.2;
  sfx.unlock();
  triggerShake(0.45, 14);
  spawnPaperConfetti(W / 2 + Math.min(270, W * 0.24), 60, 55);
  spawnFloatingText(W / 2, H * 0.34, '🏆 黄金宝箱已开启 · 锁定奖品！', '#fde047', 42);
}

function triggerRain() {
  initAudio();
  if (state !== 'PLAYING') startGame();
  rainTimer = 5.0;
  sfx.unlock();
  triggerShake(0.3, 10);
  spawnFloatingText(W / 2, H * 0.3, '🌧️ 羊年超级红包雨来袭！', '#ffd700', 38);
}

function resetToIdle() {
  state = 'IDLE'; items = []; particles = []; floatingTexts = [];
}

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (state === 'IDLE') { startGame(); return; }
  if (state === 'RESULT' && endCooldown <= 0) { startGame(); return; }
  if (state === 'PLAYING') {
    items.push({ x: e.clientX, y: Math.max(80, e.clientY - 40), vy: 260, type: 'MEGA_INGOT', score: 300, radius: 48, rot: 0, rotSpeed: 1.5 });
    sfx.ingot();
    spawnPaperConfetti(e.clientX, e.clientY, 18);
  }
});

// ================= Switch 手柄完整诊断与多模式兼容 =================
const keys = {};
window.addEventListener('keydown', (e) => {
  initAudio();
  keys[e.code] = true;
  if ((state === 'IDLE' || (state === 'RESULT' && endCooldown <= 0)) && (e.code === 'Space' || e.code === 'Enter')) startGame();
  if (state === 'PLAYING' && e.code === 'Space') triggerDash();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

window.addEventListener('gamepadconnected', (e) => {
  // 自动识别单只 Joy-Con (L) 或 (R) 并切换对应横握模式
  const id = e.gamepad.id.toLowerCase();
  if (id.includes('(l)')) { joyMode = 1; document.getElementById('mode-btn').textContent = JOY_MODES[1]; }
  else if (id.includes('(r)')) { joyMode = 2; document.getElementById('mode-btn').textContent = JOY_MODES[2]; }
});

let prevAnyButton = false;

function readInput() {
  let moveX = 0;
  let anyBtn = false;

  if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

  const badge = document.getElementById('pad-status');
  const diag = document.getElementById('diag-box');

  if (!navigator.getGamepads) {
    badge.textContent = '浏览器不支持手柄';
    badge.className = 'host-badge disconnected';
    diag.textContent = '诊断: 当前环境屏蔽了 Gamepad API，请用 Chrome 并通过 http://localhost 访问';
    return moveX;
  }

  const pads = Array.from(navigator.getGamepads()).filter(p => p && p.connected);
  if (pads.length === 0) {
    badge.textContent = '未连接 (按任意键唤醒)';
    badge.className = 'host-badge disconnected';
    const isFile = window.location.protocol === 'file:';
    diag.textContent = isFile
      ? '诊断: 0个手柄。若蓝牙已连仍无反应，请用 python3 -m http.server 启动 localhost 打开'
      : '诊断: 0个手柄。请长按手柄侧边SYNC黑圆键配对，连上后按任意键';
    prevAnyButton = false;
    return Math.max(-1, Math.min(1, moveX));
  }

  // 优先选择当前有按键或摇杆动作的手柄
  let activePad = pads[0];
  for (const p of pads) {
    if (p.buttons.some(b => b.pressed)) { activePad = p; break; }
  }

  badge.textContent = `已连接 (${pads.length}个)`;
  badge.className = 'host-badge connected';

  // 收集按下的按键编号，方便现场一眼诊断
  const pressedIdx = [];
  activePad.buttons.forEach((b, idx) => { if (b.pressed) pressedIdx.push(idx); });
  anyBtn = pressedIdx.length > 0;

  const a0 = activePad.axes[0] ?? 0;
  const a1 = activePad.axes[1] ?? 0;
  const a9 = activePad.axes[9]; // 单只 Joy-Con 常见苦力帽轴

  // 解析常规摇杆
  let stickX = 0;
  if (joyMode === 0) {
    // 标准模式
    stickX = Math.abs(a0) > 0.18 ? a0 : (Math.abs(activePad.axes[2] || 0) > 0.18 ? activePad.axes[2] : 0);
    if (activePad.buttons[14]?.pressed) stickX = -1;
    if (activePad.buttons[15]?.pressed) stickX = 1;
  } else if (joyMode === 1) {
    // 单只左手柄 Joy-Con (L) 横握：上下轴变左右
    if (Math.abs(a1) > 0.18) stickX = a1;
    else if (Math.abs(a0) > 0.18) stickX = -a0;
  } else if (joyMode === 2) {
    // 单只右手柄 Joy-Con (R) 横握：上下轴反向变左右
    if (Math.abs(a1) > 0.18) stickX = -a1;
    else if (Math.abs(a0) > 0.18) stickX = a0;
  }

  // 解析单只 Joy-Con 苦力帽 (axes[9]，静置时约为 3.28，推摇杆时在 -1 ~ +1 之间)
  if (stickX === 0 && typeof a9 === 'number' && a9 >= -1.05 && a9 <= 1.05) {
    const isUp = (a9 <= -0.65 || a9 >= 0.95);
    const isDown = (a9 >= -0.2 && a9 <= 0.5);
    const isLeft = (a9 >= 0.35 && a9 <= 1.05);
    const isRight = (a9 >= -0.75 && a9 <= -0.05);

    if (joyMode === 0) {
      if (isLeft) stickX = -1;
      else if (isRight) stickX = 1;
    } else if (joyMode === 1) {
      if (isUp) stickX = -1;
      else if (isDown) stickX = 1;
    } else if (joyMode === 2) {
      if (isDown) stickX = -1;
      else if (isUp) stickX = 1;
    }
  }

  if (stickX !== 0) moveX = stickX;

  diag.textContent = `名称:${activePad.id.slice(0, 16)} | 按键:[${pressedIdx.join(',')}] | a0:${a0.toFixed(1)} a1:${a1.toFixed(1)}${typeof a9 === 'number' ? ' hat:' + a9.toFixed(1) : ''}`;

  if (anyBtn && !prevAnyButton) {
    initAudio();
    if (state === 'IDLE') startGame();
    else if (state === 'RESULT' && endCooldown <= 0) startGame();
    else if (state === 'PLAYING') triggerDash();
  }
  prevAnyButton = anyBtn;

  return Math.max(-1, Math.min(1, moveX));
}

function triggerDash() {
  if (player.dashCooldown <= 0 && player.stunTimer <= 0) {
    player.dashTimer = 0.16;
    player.dashCooldown = 0.65;
    player.bounceScale = 1.25;
    sfx.dash();
    spawnPaperConfetti(player.x, player.y + 30, 12);
  }
}

function startGame() {
  state = 'PLAYING';
  score = 0; targetReached = false; timeLeft = GAME_DURATION;
  combo = 0; maxCombo = 0; rainTimer = 0;
  items = []; particles = []; floatingTexts = [];
  player.x = W / 2; player.stunTimer = 0; player.dashTimer = 0; player.bounceScale = 1;
  sfx.coin();
}

function finishGame() {
  state = 'RESULT';
  endCooldown = 1.5;
  if (score >= targetScore) {
    sfx.win();
    triggerShake(0.5, 12);
    for (let i = 0; i < 6; i++) {
      setTimeout(() => spawnPaperConfetti(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.4), 35), i * 240);
    }
  } else {
    sfx.bomb();
  }
}

// ================= 掉落物与粒子 =================
function spawnItem() {
  const margin = 95;
  const x = margin + Math.random() * (W - margin * 2);
  const progress = 1 - timeLeft / GAME_DURATION;
  const rotSpeed = (Math.random() - 0.5) * 3.5;

  if (rainTimer > 0) {
    const isIngot = Math.random() < 0.35;
    items.push({ x, y: -50, vy: 360 + Math.random() * 140, type: isIngot ? 'INGOT' : 'RED_PACKET', score: isIngot ? 150 : 50, radius: isIngot ? 36 : 32, rot: 0, rotSpeed });
    return;
  }

  const r = Math.random();
  if (r < 0.22 + progress * 0.08) items.push({ x, y: -50, vy: 280 + progress * 150 + Math.random() * 80, type: 'BOMB', score: -100, radius: 34, rot: 0, rotSpeed });
  else if (r < 0.42) items.push({ x, y: -50, vy: 340 + progress * 140 + Math.random() * 70, type: 'INGOT', score: 150, radius: 36, rot: 0, rotSpeed });
  else if (r < 0.70) items.push({ x, y: -50, vy: 270 + progress * 120 + Math.random() * 60, type: 'DUMPLING', score: 80, radius: 32, rot: 0, rotSpeed });
  else items.push({ x, y: -50, vy: 240 + progress * 120 + Math.random() * 60, type: 'RED_PACKET', score: 50, radius: 32, rot: 0, rotSpeed });
}

function spawnPaperConfetti(x, y, count, isSmoke = false) {
  const palette = isSmoke ? ['#1f2937', '#374151', '#6b7280', '#ef4444'] : ['#ffd700', '#ef4444', '#ffffff', '#fbbf24', '#f87171'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = isSmoke ? (90 + Math.random() * 220) : (140 + Math.random() * 380);
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - (isSmoke ? 40 : 140),
      life: 0.65 + Math.random() * 0.45, maxLife: 1.1,
      color: palette[Math.floor(Math.random() * palette.length)],
      size: isSmoke ? (10 + Math.random() * 14) : (6 + Math.random() * 7),
      shape: isSmoke ? 'circle' : (Math.random() < 0.45 ? 'star' : 'ribbon'),
      rot: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 14
    });
  }
}

function spawnFloatingText(x, y, text, color, size = 28) {
  floatingTexts.push({ x, y, text, color, size, life: 1.05, scale: 1.35 });
}

function update(dt) {
  const moveX = readInput();

  if (shakeTimer > 0) shakeTimer -= dt;
  if (chestPopTimer > 0) chestPopTimer -= dt;
  player.bounceScale += (1 - player.bounceScale) * Math.min(1, dt * 14);

  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.shape === 'circle' ? 120 : 480) * dt; p.rot += p.vRot * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);

  floatingTexts.forEach(f => { f.y -= 65 * dt; f.scale += (1 - f.scale) * Math.min(1, dt * 12); f.life -= dt; });
  floatingTexts = floatingTexts.filter(f => f.life > 0);

  if (state === 'RESULT') { if (endCooldown > 0) endCooldown -= dt; return; }
  if (state !== 'PLAYING') return;

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finishGame(); return; }

  if (rainTimer > 0) rainTimer -= dt;
  if (player.stunTimer > 0) player.stunTimer -= dt;
  if (player.dashCooldown > 0) player.dashCooldown -= dt;
  if (player.dashTimer > 0) player.dashTimer -= dt;

  if (player.stunTimer <= 0) {
    const mult = player.dashTimer > 0 ? 2.4 : 1.0;
    player.vx = moveX * player.speed * mult;
    if (Math.abs(moveX) > 0.1) player.facing = moveX > 0 ? 1 : -1;
    player.x += player.vx * dt;
    player.x = Math.max(75, Math.min(W - 75, player.x));
  }

  spawnTimer -= dt;
  const interval = rainTimer > 0 ? 0.14 : Math.max(0.28, 0.54 - (1 - timeLeft / GAME_DURATION) * 0.22);
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = interval; }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.rot += it.rotSpeed * dt;

    if (Math.abs(it.x - player.x) < player.w * 0.45 + it.radius * 0.7 && Math.abs(it.y - player.y) < player.h * 0.42 + it.radius * 0.7) {
      if (it.type === 'BOMB') {
        score = Math.max(0, score + it.score);
        combo = 0; player.stunTimer = 0.9; player.bounceScale = 0.75;
        sfx.bomb(); triggerShake(0.4, 18);
        spawnPaperConfetti(it.x, it.y, 26, true);
        spawnFloatingText(player.x, player.y - 75, '💥 炸晕啦 -100', '#ef4444', 32);
      } else {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        const bonusMult = combo >= 10 ? 1.5 : (combo >= 5 ? 1.2 : 1.0);
        const gained = Math.round(it.score * bonusMult);
        score += gained;
        player.bounceScale = it.type === 'MEGA_INGOT' ? 1.32 : 1.18;

        if (it.type === 'INGOT' || it.type === 'MEGA_INGOT') {
          sfx.ingot();
          triggerShake(0.18, it.type === 'MEGA_INGOT' ? 12 : 6);
          spawnPaperConfetti(it.x, it.y, it.type === 'MEGA_INGOT' ? 40 : 22);
        } else {
          sfx.coin();
          spawnPaperConfetti(it.x, it.y, 12);
        }

        const comboTag = bonusMult > 1 ? ` 🔥${combo}连击` : '';
        spawnFloatingText(player.x, player.y - 70, `+${gained}${comboTag}`, '#fde047', it.type === 'MEGA_INGOT' ? 38 : 28);
        if (!targetReached && score >= targetScore) unlockChest();
      }
      items.splice(i, 1);
      continue;
    }
    if (it.y > H + 70) items.splice(i, 1);
  }
}

// ================= 渲染绘制 =================
function drawBackground() {
  if (assets.bg) {
    const imgRatio = assets.bg.width / assets.bg.height;
    const winRatio = W / H;
    let drawW, drawH, offsetX, offsetY;
    if (winRatio > imgRatio) { drawW = W; drawH = W / imgRatio; offsetX = 0; offsetY = H - drawH; }
    else { drawH = H; drawW = H * imgRatio; offsetX = (W - drawW) / 2; offsetY = 0; }
    ctx.drawImage(assets.bg, offsetX, offsetY, drawW, drawH);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fef3c7'); grad.addColorStop(1, '#dc2626');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  const isMoving = Math.abs(player.vx) > 20 && player.stunTimer <= 0;
  const hopY = isMoving ? -Math.abs(Math.sin(Date.now() / 75)) * 12 : 0;
  const tilt = isMoving ? Math.sin(Date.now() / 75) * 0.08 : 0;

  if (player.stunTimer > 0) {
    ctx.translate(Math.sin(Date.now() / 22) * 10, 0);
    ctx.rotate(Math.sin(Date.now() / 40) * 0.25);
  } else {
    ctx.translate(0, hopY);
    ctx.rotate(tilt);
  }

  ctx.fillStyle = 'rgba(80, 10, 10, 0.28)';
  ctx.beginPath(); ctx.ellipse(0, 56 - hopY, 52 * player.bounceScale, 13, 0, 0, Math.PI * 2); ctx.fill();

  ctx.scale(-player.facing * player.bounceScale, player.bounceScale);
  if (assets.sheep) ctx.drawImage(assets.sheep, -player.w / 2, -player.h / 2, player.w, player.h);
  else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);

  if (assets.items) {
    const hw = assets.items.width / 2, hh = assets.items.height / 2;
    let sx = 0, sy = 0;
    if (it.type === 'RED_PACKET') { sx = hw; sy = 0; }
    else if (it.type === 'DUMPLING') { sx = 0; sy = hh; }
    else if (it.type === 'BOMB') { sx = hw; sy = hh; }

    const size = it.radius * 2.45;
    if (it.type === 'MEGA_INGOT') { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 24; }
    ctx.drawImage(assets.items, sx, sy, hw, hh, -size / 2, -size / 2, size, size);
  } else {
    ctx.fillStyle = it.type === 'BOMB' ? '#1f2937' : '#fbbf24';
    ctx.beginPath(); ctx.arc(0, 0, it.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill(); }
    else if (p.shape === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * p.size * 1.4, -Math.sin((18 + i * 72) * Math.PI / 180) * p.size * 1.4);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * p.size * 0.6, -Math.sin((54 + i * 72) * Math.PI / 180) * p.size * 0.6);
      }
      ctx.closePath(); ctx.fill();
    } else { ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9); }
    ctx.restore();
  });
}

function drawHUD() {
  const barW = Math.min(520, W * 0.45), barH = 36, barX = (W - barW) / 2 - 24, barY = 26;
  ctx.fillStyle = 'rgba(65, 10, 10, 0.72)';
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 18); ctx.fill();

  const ratio = Math.min(1, score / targetScore);
  if (ratio > 0) {
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, targetReached ? '#16a34a' : '#f59e0b');
    grad.addColorStop(1, '#fde047');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(barX + 3, barY + 3, (barW - 6) * ratio, barH - 6, 15); ctx.fill();
  }

  ctx.strokeStyle = targetReached ? '#4ade80' : '#ffd700';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 18); ctx.stroke();

  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 4;
  ctx.fillText(targetReached ? `🎉 宝箱开启！当前 ${score} 分 (已达领奖线)` : `🎯 领奖目标：${score} / ${targetScore} 分`, barX + barW / 2, barY + 24);
  ctx.shadowBlur = 0;

  const chestX = barX + barW + 38, chestY = barY + barH / 2 - 4;
  ctx.save();
  ctx.translate(chestX, chestY);
  if (!targetReached && ratio > 0.7) ctx.rotate(Math.sin(Date.now() / 45) * 0.14);
  const popScale = targetReached ? (1.28 + Math.max(0, chestPopTimer) * 0.35) : 1.0;
  ctx.scale(popScale, popScale);

  if (assets.chest) {
    const hw = assets.chest.width / 2, hh = assets.chest.height;
    const drawW = 86, drawH = drawW * (hh / hw);
    ctx.drawImage(assets.chest, targetReached ? hw : 0, 0, hw, hh, -drawW / 2, -drawH / 2, drawW, drawH);
  }
  ctx.restore();

  if (state === 'PLAYING') {
    ctx.fillStyle = timeLeft <= 5 ? '#dc2626' : '#7f1d1d';
    ctx.beginPath(); ctx.roundRect(W / 2 - 68, barY + 46, 136, 42, 21); ctx.fill();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = timeLeft <= 5 ? '#fecaca' : '#fde047';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(`⏱ ${Math.ceil(timeLeft)}s`, W / 2, barY + 77);
  }
}

function drawOverlay() {
  if (state === 'IDLE') {
    ctx.fillStyle = 'rgba(45, 5, 5, 0.58)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd700'; ctx.font = 'bold 54px sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 10;
    ctx.fillText('🐑 羊年接元宝 · 开宝箱赢好礼 🧧', W / 2, H * 0.36);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif';
    ctx.fillText(`30 秒内达到 ${targetScore} 分开启黄金宝箱，即可领取奖品！`, W / 2, H * 0.45);
    ctx.fillStyle = '#fde047'; ctx.font = '20px sans-serif';
    ctx.fillText('🕹️ 摇杆左右移动接元宝 · 躲开黑鞭炮 · 任意键冲刺', W / 2, H * 0.52);
    ctx.shadowBlur = 0;

    const pulse = 1 + Math.sin(Date.now() / 220) * 0.05;
    ctx.save(); ctx.translate(W / 2, H * 0.64); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.roundRect(-195, -28, 390, 56, 28); ctx.fill();
    ctx.fillStyle = '#7f1d1d'; ctx.font = 'bold 24px sans-serif';
    ctx.fillText('按 Switch 手柄任意键开始！', 0, 9);
    ctx.restore();
  }

  if (state === 'RESULT') {
    ctx.fillStyle = 'rgba(35, 5, 5, 0.74)'; ctx.fillRect(0, 0, W, H);
    const win = score >= targetScore;
    ctx.textAlign = 'center'; ctx.fillStyle = win ? '#4ade80' : '#fca5a5'; ctx.font = 'bold 54px sans-serif';
    ctx.fillText(win ? '🏆 黄金宝箱已开启 · 恭喜获得奖品！' : '🧧 差一点点 · 再接再厉！', W / 2, H * 0.34);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 40px sans-serif';
    ctx.fillText(`最终得分：${score} 分  (目标：${targetScore} 分)`, W / 2, H * 0.45);
    ctx.fillStyle = '#fde047'; ctx.font = '22px sans-serif';
    ctx.fillText(`最高连击：${maxCombo} 连击`, W / 2, H * 0.52);
    if (endCooldown <= 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
      ctx.fillText('👉 下一位同学：按手柄任意键立即开始新的一局', W / 2, H * 0.64);
    }
  }
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);

  ctx.save();
  if (shakeTimer > 0) {
    const mag = shakeIntensity * (shakeTimer / 0.45);
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }

  ctx.clearRect(0, 0, W, H);
  drawBackground();
  items.forEach(drawItem);
  drawPlayer();
  drawParticles();

  floatingTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.translate(f.x, f.y); ctx.scale(f.scale, f.scale);
    ctx.fillStyle = f.color; ctx.font = `bold ${f.size}px sans-serif`; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 5;
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  });

  drawHUD();
  drawOverlay();
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
